<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel.js</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    img {
      max-width: 20px;
      height: auto;
    }

    table {
      border-collapse: collapse;
    }

    thead,
    tr td:first-child {
      background: #eee;
    }

    th,
    td {
      border: 1px solid #ccc;
      font-weight: normal;
      font-size: 12px;
      text-align: center;
      width: 64px;
      height: 20px;
      vertical-align: middle;
      position: relative;
      user-select: none;
    }

    span,
    input {
      position: absolute;
      inset: 0;
      vertical-align: middle;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    input {
      border: 0;
      opacity: 0;
      pointer-events: none;
      width: 100%;
      border-radius: 2px;
    }

    input:focus {
      opacity: 1;
      outline: 2px solid #09f;
      pointer-events: auto;
    }

    .selected {
      background: rgb(174, 223, 255);
    }

    th.selected {
      background: rgb(146, 211, 255);
    }
  </style>
  <script type="module">
    const $ = el => document.querySelector(el)     
    const $$ = el => document.querySelectorAll(el)

    const $head =$('thead')
    const $body =$('tbody')

    const ROWS = 10
    const COLUMNS = 5
    const FIRST_CHAR_CODE = 65

    const times = length => Array.from({ length }, (_, i) => i)
    const getColumn = i => String.fromCharCode(FIRST_CHAR_CODE + i)

    let selectedColumn = null
    let selectedCell = null

    let STATE = times(COLUMNS)
      .map(i => times(ROWS).map(j => ({ computedValue: '', value: '' })))

    function generateCellsConstants(cells) {
      return cells.map((rows, x) => {
        return rows.map((cell, y) => {
          const letter = getColumn(x)
          const cellId = `${letter}${y + 1}`
          let val = cell.computedValue
          if (typeof val === 'string' && val.startsWith('!ERROR')) {
            val = 0
          }
          return `const ${cellId} = ${JSON.stringify(val)};`
        }).join('\n')
      }).join('\n')
    }

    function computeAllCells(cells, constants) {
      cells.forEach((rows, x) => {
        rows.forEach((cell, y) => {
          cell.computedValue = computeValue(cell.value, constants)
        })
      })
    }

    function computeValue(value, constants) {
      if (typeof value === 'number') return value
      if (value === '' || value == null) return ''
      if (!String(value).startsWith('=')) {
        const num = Number(value)
        return isNaN(num) ? value : num
      }

      const formula = String(value).slice(1)
      let computedValue
      try {
        computedValue = eval(`(() => {
          ${constants}
          return ${formula};
        })()`)
      } catch (e) {
        computedValue = `!ERROR: ${e.message}`
      }
      return computedValue
    }

    const renderSpreadSheet = () => {
      const headerHTML = `<tr>
          <th></th>
          ${times(COLUMNS).map(i => `<th>${getColumn(i)}</th>`).join('')}
        </tr>`

      $head.innerHTML = headerHTML

      const bodyHTML = times(ROWS).map(row => {
        return `<tr>
          <td>${row + 1}</td>
          ${times(COLUMNS).map(column => {
            const cell = STATE[column][row]
            const isSelected = selectedCell && selectedCell.x === column && selectedCell.y === row
            return `
            <td data-x="${column}" data-y="${row}" class="${isSelected ? 'selected' : ''}">
              <span>${cell.computedValue ?? ''}</span>
              <input type="text" value="${cell.value ?? ''}" />
            </td>
            `
          }).join('')}
        </tr>`
      }).join('')

      $body.innerHTML = bodyHTML
    }

    function updateCellAndRefresh(x, y, value) {
      let newState = structuredClone(STATE)
      newState[x][y].value = value
      const constants = generateCellsConstants(newState)
      computeAllCells(newState, constants)
      STATE = newState
      renderSpreadSheet()
    }

    $body.addEventListener('click', event => {       
      const td = event.target.closest('td')       
      if (!td) return       
      const x = Number(td.dataset.x)       
      const y = Number(td.dataset.y)        
      $$('.selected').forEach(el => el.classList.remove('selected'))
      selectedColumn = null
      selectedCell = { x, y }
      td.classList.add('selected')

      const input = td.querySelector('input')
      input.focus()
      input.setSelectionRange(input.value.length, input.value.length)

      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          input.blur()
        }
      }

      input.onblur = () => {
        if (input.value !== STATE[x][y].value) {
          updateCellAndRefresh(x, y, input.value)
        }
      }
    })

    $head.addEventListener('click', event => {
      const th = event.target.closest('th')
      if (!th) return

      const x = [...th.parentNode.children].indexOf(th)
      if (x <= 0) return

      selectedColumn = x - 1
      selectedCell = null

      $$('.selected').forEach(el => el.classList.remove('selected'))       
      th.classList.add('selected')       
      $$
      (`tr td:nth-child(${x + 1})`).forEach(el => el.classList.add('selected'))
    })

    document.addEventListener('keydown', event => {
      if (event.key === 'Backspace') {
        if (selectedColumn !== null) {
          let newState = structuredClone(STATE)
          times(ROWS).forEach(row => {
            newState[selectedColumn][row].value = ''
          })
          const constants = generateCellsConstants(newState)
          computeAllCells(newState, constants)
          STATE = newState
          renderSpreadSheet()
        } else if (selectedCell !== null) {
          updateCellAndRefresh(selectedCell.x, selectedCell.y, '')
        }
      }
    })

    document.addEventListener('copy', event => {
      if (selectedColumn !== null) {
        const columnValues = times(ROWS).map(row => STATE[selectedColumn][row].value)
        event.clipboardData.setData('text/plain', columnValues.join('\n'))
        event.preventDefault()
      } else if (selectedCell !== null) {
        event.clipboardData.setData('text/plain', STATE[selectedCell.x][selectedCell.y].value)
        event.preventDefault()
      }
    })

    document.addEventListener('paste', event => {
      if (selectedCell === null) return
      event.preventDefault()

      const text = event.clipboardData.getData('text/plain')
      if (!text) return

      const rows = text.split(/\r?\n/).map(row => row.split('\t'))
      let newState = structuredClone(STATE)

      rows.forEach((row, rowIndex) => {
        row.forEach((cellValue, colIndex) => {
          const targetX = selectedCell.x + colIndex
          const targetY = selectedCell.y + rowIndex

          if (targetX < COLUMNS && targetY < ROWS) {
            newState[targetX][targetY].value = cellValue
          }
        })
      })

      const constants = generateCellsConstants(newState)
      computeAllCells(newState, constants)
      STATE = newState
      renderSpreadSheet()
    })

    document.addEventListener('click', event => {
      const { target } = event
      if (!target.closest('th') && !target.closest('td')) {
        $$('.selected').forEach(el => el.classList.remove('selected'))
        selectedColumn = null
        selectedCell = null
      }
    })

    renderSpreadSheet()
  </script>
</head>

<body>
  <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Microsoft_Excel_2013-2019_logo.svg/1280px-Microsoft_Excel_2013-2019_logo.svg.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=thumbnail" />

  <table>
    <thead></thead>
    <tbody></tbody>
  </table>
</body>

</html>
